name: Foreign metadata validation

on:
  push:
    branches: [validation/foreign-metadata-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2810fafebbbc3540c0c46bb52759c57eed6df9d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false
          sparse-checkout: .github/validation
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: |
            source/go.sum
            source/plugin/agentanalytics/go.sum
      - name: Record tested source and workspace
        run: |
          mkdir -p ../evidence
          git rev-parse HEAD | tee ../evidence/source-sha.txt
          git ls-tree -r HEAD > ../evidence/source-tree.txt
          test -f go.work || go work init
          go work use -r .
          go version | tee ../evidence/go-version.txt
          go work edit -json > ../evidence/workspace.json
      - name: Formatting
        run: |
          gofmt -d internal/llminternal/contents_processor.go internal/llminternal/foreign_thoughts_test.go \
            internal/llminternal/foreign_payloads_test.go | tee ../evidence/gofmt.diff
          test ! -s ../evidence/gofmt.diff
      - name: Download dependencies
        run: |
          go mod download
          (cd plugin/agentanalytics && go mod download)
      - name: Regression proof on original source
        run: |
          git show 733b52570555653a768134ab827e01691be8d871:internal/llminternal/contents_processor.go > internal/llminternal/contents_processor.go
          set +e
          go test -race -mod=readonly -count=1 -json ./internal/llminternal \
            -run 'TestConvertForeignEvent_RetainsPayloadParts|TestContentsRequestProcessor_ForeignThoughts|TestContentsRequestProcessor_ForeignThoughtCurrentTurn' \
            > ../evidence/original.jsonl 2> ../evidence/original.stderr
          code=$?
          go run -race -mod=readonly ../validation/.github/validation/runner-probe.go > ../evidence/runner-original.txt 2>&1
          runner_code=$?
          set -e
          git restore internal/llminternal/contents_processor.go
          test "$code" -eq 1
          test "$runner_code" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('../evidence/original.jsonl').read_text().splitlines() if line.startswith('{')]
          failed = [event['Test'] for event in events if event.get('Action') == 'fail' and '/' in event.get('Test', '')]
          assert len(failed) == 42, failed
          assert not any(event.get('Action') == 'build-fail' for event in events)
          assert 'PASS 2 FAIL 4 TOTAL 6' in Path('../evidence/runner-original.txt').read_text()
          print('Original source: 42 failing leaf regressions; Runner probe 4 fail / 2 controls pass')
          PY
      - name: Focused race tests and offline Runner probe
        run: |
          go test -race -mod=readonly -count=3 -shuffle=1793110651171935001 -json ./internal/llminternal > ../evidence/focused.jsonl
      - name: Offline Runner probe
        if: ${{ !cancelled() }}
        run: |
          go run -race -mod=readonly ../validation/.github/validation/runner-probe.go | tee ../evidence/runner-fixed.txt
          grep -F 'PASS 6 FAIL 0 TOTAL 6' ../evidence/runner-fixed.txt
      - name: Mutation coverage
        if: ${{ !cancelled() }}
        run: python3 ../validation/.github/validation/mutations.py | tee ../evidence/mutations.txt
      - name: Build and race tests in every workspace module
        if: ${{ !cancelled() }}
        run: |
          go build -mod=readonly work 2>&1 | tee ../evidence/build.txt
          go vet -mod=readonly work 2>&1 | tee ../evidence/vet.txt
          go test -race -mod=readonly -count=1 -shuffle=on -timeout=180s -json work > ../evidence/workspace-tests.jsonl
      - name: Tidy check in both modules
        if: ${{ !cancelled() }}
        run: |
          go mod tidy -diff | tee ../evidence/root-tidy.txt
          (cd plugin/agentanalytics && go mod tidy -diff) | tee ../evidence/analytics-tidy.txt
          test ! -s ../evidence/root-tidy.txt
          test ! -s ../evidence/analytics-tidy.txt
      - name: Install pinned linter
        if: ${{ !cancelled() }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.1
      - name: Lint and formatting checks in both modules
        if: ${{ !cancelled() }}
        run: |
          golangci-lint run --timeout=10m 2>&1 | tee ../evidence/root-lint.txt
          golangci-lint fmt --diff | tee ../evidence/root-format.diff
          (cd plugin/agentanalytics && golangci-lint run --timeout=10m) 2>&1 | tee ../evidence/analytics-lint.txt
          (cd plugin/agentanalytics && golangci-lint fmt --diff) | tee ../evidence/analytics-format.diff
          test ! -s ../evidence/root-format.diff
          test ! -s ../evidence/analytics-format.diff
      - name: Verify unchanged tracked source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreign-metadata-evidence
          path: evidence/
          if-no-files-found: error

  baseline-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 733b52570555653a768134ab827e01691be8d871
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Record exact unmodified baseline
        run: |
          mkdir -p ../baseline-evidence
          git rev-parse HEAD | tee ../baseline-evidence/source-sha.txt
          go version | tee ../baseline-evidence/go-version.txt
          test -f go.work || go work init
          go work use -r .
          go work edit -json > ../baseline-evidence/workspace.json
      - name: Same whole-package race count and captured shuffle seed
        run: |
          go test -race -mod=readonly -count=3 -shuffle=1793110651171935001 -json ./internal/llminternal > ../baseline-evidence/focused.jsonl
      - name: Verify pristine baseline source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreign-metadata-baseline-evidence
          path: baseline-evidence/
          if-no-files-found: error
